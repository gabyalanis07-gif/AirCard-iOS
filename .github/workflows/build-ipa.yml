name: Build AirCard IPA

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          git rev-parse HEAD
      - name: Build using the official script
        run: bash ./build-ipa.sh
      - name: Verify IPA
        run: |
          test -s build/AirCard-iOS.ipa
          unzip -t build/AirCard-iOS.ipa
          shasum -a 256 build/AirCard-iOS.ipa > build/AirCard-iOS.ipa.sha256
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS-IPA
          path: |
            build/AirCard-iOS.ipa
            build/AirCard-iOS.ipa.sha256
          if-no-files-found: error
          retention-days: 30
